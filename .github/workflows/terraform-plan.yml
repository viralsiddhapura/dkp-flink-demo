name: terraform-plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - "terragrunt/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    env:
      TG_S3_BUCKET: ${{ secrets.TG_S3_BUCKET }}
      TG_S3_REGION: ${{ secrets.TG_S3_REGION }}
      TG_DDB_LOCK_TABLE: ${{ secrets.TG_DDB_LOCK_TABLE }}
      CONFLUENT_CLOUD_API_KEY: ${{ secrets.CONFLUENT_CLOUD_API_KEY }}
      CONFLUENT_CLOUD_API_SECRET: ${{ secrets.CONFLUENT_CLOUD_API_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_STATE_ROLE_ARN }}
          aws-region: ${{ secrets.TG_S3_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - uses: gruntwork-io/terragrunt-action@v2
        with:
          tg_version: 0.66.0
          tf_version: 1.9.5
          tg_dir: terragrunt/${{ matrix.env }}
          tg_command: plan
        env:
          # All env-scoped Confluent identifiers come from environment secrets.
          CONFLUENT_ENV_ID_DEV: ${{ secrets.CONFLUENT_ENV_ID_DEV }}
          CONFLUENT_ENV_CRN_DEV: ${{ secrets.CONFLUENT_ENV_CRN_DEV }}
          CONFLUENT_FLINK_REGION_ID_DEV: ${{ secrets.CONFLUENT_FLINK_REGION_ID_DEV }}
          CONFLUENT_KAFKA_CLUSTER_ID_DEV: ${{ secrets.CONFLUENT_KAFKA_CLUSTER_ID_DEV }}
          CONFLUENT_KAFKA_REST_ENDPOINT_DEV: ${{ secrets.CONFLUENT_KAFKA_REST_ENDPOINT_DEV }}
          CONFLUENT_KAFKA_ADMIN_API_KEY_DEV: ${{ secrets.CONFLUENT_KAFKA_ADMIN_API_KEY_DEV }}
          CONFLUENT_KAFKA_ADMIN_API_SECRET_DEV: ${{ secrets.CONFLUENT_KAFKA_ADMIN_API_SECRET_DEV }}
          # Repeat staging/prod blocks similarly. Omitted here for brevity in template.
