name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "terragrunt/**"
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, staging, prod]

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env || 'dev' }}
    env:
      TG_S3_BUCKET: ${{ secrets.TG_S3_BUCKET }}
      TG_S3_REGION: ${{ secrets.TG_S3_REGION }}
      TG_DDB_LOCK_TABLE: ${{ secrets.TG_DDB_LOCK_TABLE }}
      CONFLUENT_CLOUD_API_KEY: ${{ secrets.CONFLUENT_CLOUD_API_KEY }}
      CONFLUENT_CLOUD_API_SECRET: ${{ secrets.CONFLUENT_CLOUD_API_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_STATE_ROLE_ARN }}
          aws-region: ${{ secrets.TG_S3_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - uses: gruntwork-io/terragrunt-action@v2
        with:
          tg_version: 0.66.0
          tf_version: 1.9.5
          tg_dir: terragrunt/${{ github.event.inputs.env || 'dev' }}
          tg_command: apply -auto-approve
